<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>십계명 메타버스 - 시내산 광야 대탐험</title>
  <link rel="stylesheet" href="./src/style.css">
  <!-- 실시간 P2P WebRTC 라이브러리 및 QR코드 생성 라이브러리 -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- 모바일 세로 모드 경고 오버레이 (가로 전환 안내) -->
    <div id="orientation-overlay" class="orientation-overlay hidden">
      <div class="orientation-box">
        <div class="phone-rotate-icon">📱 ➔ 🔄</div>
        <h2>화면을 가로로 돌려주세요!</h2>
        <p>십계명 메타버스는 넓은 가로 화면에 최적화되어 있습니다.</p>
      </div>
    </div>

    <!-- 우측 상단 상시 컨트롤러 (음소거 버튼) -->
    <header class="top-nav">
      <div class="game-title-tag">⛰️ 십계명 메타버스</div>
      <div class="top-buttons">
        <button id="btn-room-modal" class="nav-btn highlight" aria-label="방 개설 및 QR코드">
          <span id="room-icon">📱</span> <span id="room-btn-text">방 QR코드</span>
        </button>
        <button id="btn-view-toggle" class="nav-btn" aria-label="시야 전환">
          <span id="view-icon">🔍</span> <span id="view-text">전체 뷰</span>
        </button>
        <button id="btn-sound-toggle" class="nav-btn" aria-label="음소거 토글">
          <span id="sound-icon">🔊</span> 사운드
        </button>
      </div>
    </header>

    <!-- 메인 캔버스 뷰포트 (게임 화면) -->
    <div id="game-container">
      <canvas id="game-canvas"></canvas>

      <!-- 모바일 가상 조작 컨트롤러 UI (터치 환경) -->
      <div id="mobile-controls" class="mobile-controls">
        <div id="joystick-zone" class="joystick-zone">
          <div id="joystick-base" class="joystick-base">
            <div id="joystick-stick" class="joystick-stick"></div>
          </div>
        </div>

        <div class="action-zone">
          <button id="btn-mobile-action" class="mobile-action-btn">
            <span class="action-icon">📜</span>
            <span class="action-text">상호작용</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 아바타 커스터마이징 룸 모달 -->
    <div id="avatar-modal" class="modal-overlay">
      <div class="customizer-card">
        <div class="customizer-header">
          <h2>✨ 나만의 탐험가 아바타 만들기</h2>
          <p>시내산 광야를 함께 걸어갈 멋진 아바타를 꾸며보세요!</p>
        </div>

        <div class="customizer-layout">
          <!-- 좌측: 미리보기 및 닉네임 -->
          <div class="preview-panel">
            <div class="avatar-canvas-wrapper">
              <canvas id="avatar-preview-canvas" width="220" height="280"></canvas>
            </div>
            <div class="nickname-input-box">
              <label for="input-nickname">내 닉네임</label>
              <input type="text" id="input-nickname" maxlength="8" placeholder="예: 다윗, 한나, 믿음이" value="믿음이">
            </div>
          </div>

          <!-- 우측: 캐릭터 및 파츠 커스터마이징 패널 -->
          <div class="options-panel">
            <div class="opt-section">
              <label>성경 탐험가 선택 (8인 8색)</label>
              <div id="char-options-grid" class="char-badge-grid"></div>
            </div>

            <div class="opt-section">
              <label>머리 장식 / 악세서리</label>
              <div id="accessory-options-row" class="opt-pill-row"></div>
            </div>

            <div class="opt-section">
              <label>소품 / 장비</label>
              <div id="equipment-options-row" class="opt-pill-row"></div>
            </div>

            <div class="opt-section">
              <label>의상 색상</label>
              <div id="color-options-row" class="opt-color-row"></div>
            </div>
          </div>
        </div>

        <div class="customizer-footer">
          <button id="btn-confirm-avatar" class="primary-btn">시내산 광야로 출발! 🚀</button>
        </div>
      </div>
    </div>

    <!-- 교사용 우측 상단 플로팅 QR코드 위젯 (언제든 최소화/확장 가능) -->
    <div id="floating-qr-widget" class="floating-qr-box">
      <div class="floating-qr-header">
        <span class="qr-badge">📱 학생 입장 QR</span>
        <div class="floating-qr-actions">
          <button id="btn-toggle-qr-size" class="qr-action-btn" title="접기/펼치기">➖</button>
          <button id="btn-close-qr-widget" class="qr-action-btn" title="감추기">✕</button>
        </div>
      </div>
      <div id="floating-qr-body" class="floating-qr-body">
        <div class="floating-qr-code">
          <div id="qrcode-box"></div>
        </div>
        <div class="floating-qr-info">
          <div class="room-code-tag">방 코드: <strong id="room-code-display">생성 중...</strong></div>
          <div class="room-players-tag">접속자: <span id="player-count-display">1</span>명</div>
        </div>
        <div class="floating-qr-url">
          <input type="text" id="input-join-url" readonly value="" placeholder="접속 URL">
          <button id="btn-copy-url" class="secondary-btn">복사</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
